<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARCA — Histórico de Cartas</title>
<style>
  :root {
    --verde: #00713c;
    --verde-claro: #e6f2ec;
    --cinza: #6b7280;
    --borda: #e5e7eb;
    --fundo: #f7f8fa;
    --texto: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo); color: var(--texto); font-size: 14px;
  }
  header {
    background: var(--verde); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { opacity: .85; font-size: 13px; margin-left: 4px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 28px; }

  .filtros {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: #fff; border: 1px solid var(--borda); border-radius: 10px;
    padding: 16px; margin-bottom: 18px;
  }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--cinza); font-weight: 600; }
  .campo input, .campo select {
    padding: 8px 10px; border: 1px solid var(--borda); border-radius: 7px; font-size: 13px; background: #fff; min-width: 150px;
  }
  .campo input:focus, .campo select:focus { outline: 2px solid var(--verde-claro); border-color: var(--verde); }
  .btn {
    padding: 8px 14px; border: none; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: var(--verde); color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.sec { background: #fff; color: var(--verde); border: 1px solid var(--verde); }
  .btn.ghost { background: transparent; color: var(--cinza); border: 1px solid var(--borda); }
  .btn.danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { background: #fafbfc; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--cinza); }
  tr:last-child td { border-bottom: none; }
  tr.linha:hover { background: var(--verde-claro); cursor: pointer; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--verde-claro); color: var(--verde); }
  .contador { color: var(--cinza); font-size: 13px; margin: 4px 2px 12px; }
  .vazio { text-align: center; padding: 48px; color: var(--cinza); }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .overlay.aberto { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 620px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--borda); }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 8px 22px 4px; }
  .modal-foot { padding: 16px 22px; border-top: 1px solid var(--borda); display: flex; gap: 10px; flex-wrap: wrap; }
  .x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--cinza); line-height: 1; }

  .linha-campo { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f2f4; }
  .linha-campo:last-child { border-bottom: none; }
  .lc-label { width: 165px; flex-shrink: 0; font-size: 12px; color: var(--cinza); font-weight: 600; padding-top: 3px; }
  .lc-valor { flex: 1; word-break: break-word; }
  .lc-valor.vazio-campo { color: #b7bcc4; font-style: italic; }
  .lc-valor input { width: 100%; padding: 5px 8px; border: 1px solid var(--borda); border-radius: 6px; font-size: 13px; }
  .copia { background: none; border: 1px solid var(--borda); border-radius: 6px; cursor: pointer; padding: 3px 7px; font-size: 12px; color: var(--cinza); flex-shrink: 0; }
  .copia:hover { border-color: var(--verde); color: var(--verde); }
  .copia.ok { border-color: var(--verde); color: var(--verde); background: var(--verde-claro); }

  .minuta-box { display: none; margin-top: 12px; padding: 14px; background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px; white-space: pre-wrap; font-size: 13px; line-height: 1.55; max-height: 340px; overflow-y: auto; }
  .minuta-box.aberto { display: block; }
  .aviso { background: #fff8e6; border: 1px solid #f5e0a3; color: #8a6d1a; padding: 14px 16px; border-radius: 8px; margin-bottom: 18px; }
</style>
</head>
<body>
  <header>
    <h1>ARCA — Histórico de Cartas</h1>
    <span class="sub">registro compartilhado de todas as cartas geradas</span>
  </header>

  <div class="container">
    <div id="aviso-db" class="aviso" style="display:none">
      O banco de dados ainda não foi configurado. Configure a variável <b>DATABASE_URL</b> no Render para ativar o histórico.
    </div>

    <div class="filtros">
      <div class="campo">
        <label>Buscar</label>
        <input id="f-q" type="text" placeholder="título, tema, ofício, processo…" style="min-width:220px" />
      </div>
      <div class="campo">
        <label>Responsável</label>
        <select id="f-responsavel"><option value="">Todos</option></select>
      </div>
      <div class="campo">
        <label>Malha</label>
        <select id="f-malha"><option value="">Todas</option></select>
      </div>
      <div class="campo">
        <label>Órgão</label>
        <select id="f-orgao"><option value="">Todos</option></select>
      </div>
      <div class="campo">
        <label>De</label>
        <input id="f-de" type="date" />
      </div>
      <div class="campo">
        <label>Até</label>
        <input id="f-ate" type="date" />
      </div>
      <button class="btn" onclick="aplicarFiltros()">Filtrar</button>
      <button class="btn ghost" onclick="limparFiltros()">Limpar</button>
    </div>

    <div class="contador" id="contador"></div>

    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Responsável</th>
          <th>Malha</th>
          <th>Órgão</th>
          <th>Tema</th>
          <th>Gerado em</th>
        </tr>
      </thead>
      <tbody id="corpo">
        <tr><td colspan="6" class="vazio">Carregando…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal de detalhes -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="m-titulo">—</h2>
        <button class="x" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-body" id="m-body"></div>
      <div class="modal-foot">
        <button class="btn sec" onclick="toggleMinuta()">Ver minuta completa</button>
        <button class="btn" id="m-copiar-tudo">Copiar tudo</button>
        <button class="btn sec" id="m-baixar">↓ Baixar DOCX</button>
        <button class="btn ghost" id="m-salvar" style="display:none">Salvar responsável</button>
        <button class="btn danger" id="m-excluir">Excluir</button>
      </div>
    </div>
  </div>

<script>
const API = '/api/historico';
let entradaAtual = null;
let cacheAtribuicao = { responsavel: '', area: '' };

// Ordem e rótulos idênticos à lista do SharePoint
const CAMPOS_SHAREPOINT = [
  { rot: 'Título',              chave: 'titulo' },
  { rot: 'Conferida?',          chave: null },
  { rot: 'Responsável',         chave: 'responsavel', editavel: true },
  { rot: 'Área do Responsável', chave: 'area', editavel: true },
  { rot: 'Data de Envio',       chave: null },
  { rot: 'Assuntos',            chave: 'assuntos' },
  { rot: 'Tema',                chave: 'tema' },
  { rot: 'Órgão',               chave: 'orgao' },
  { rot: 'Malha',               chave: 'malha' },
  { rot: 'Ofício',              chave: 'oficio' },
  { rot: 'Dilação?',            chave: null },
  { rot: 'Prazo com Dilação',   chave: null },
  { rot: 'Forma de Envio',      chave: 'forma_envio' },
  { rot: 'Protocolo',           chave: null },
];

function fmtData(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

async function carregarOpcoes() {
  try {
    const r = await fetch(`${API}/opcoes`).then(r => r.json());
    preencher('f-responsavel', r.responsaveis, 'Todos');
    preencher('f-malha', r.malhas, 'Todas');
    preencher('f-orgao', r.orgaos, 'Todos');
  } catch (e) { /* silencioso */ }
}
function preencher(id, valores, labelTodos) {
  const sel = document.getElementById(id);
  const atual = sel.value;
  sel.innerHTML = `<option value="">${labelTodos}</option>` + (valores || []).map(v => `<option>${esc(v)}</option>`).join('');
  sel.value = atual;
}

async function carregarLista() {
  const params = new URLSearchParams();
  const q = document.getElementById('f-q').value.trim();
  const resp = document.getElementById('f-responsavel').value;
  const malha = document.getElementById('f-malha').value;
  const orgao = document.getElementById('f-orgao').value;
  const de = document.getElementById('f-de').value;
  const ate = document.getElementById('f-ate').value;
  if (q) params.set('q', q);
  if (resp) params.set('responsavel', resp);
  if (malha) params.set('malha', malha);
  if (orgao) params.set('orgao', orgao);
  if (de) params.set('de', de);
  if (ate) params.set('ate', ate + 'T23:59:59');

  const corpo = document.getElementById('corpo');
  corpo.innerHTML = `<tr><td colspan="6" class="vazio">Carregando…</td></tr>`;

  try {
    const r = await fetch(`${API}?${params}`).then(r => r.json());
    if (r.dbDesativado) {
      document.getElementById('aviso-db').style.display = 'block';
      corpo.innerHTML = `<tr><td colspan="6" class="vazio">Histórico desativado.</td></tr>`;
      document.getElementById('contador').textContent = '';
      return;
    }
    const lista = r.historico || [];
    document.getElementById('contador').textContent =
      lista.length ? `${lista.length} carta(s) encontrada(s)` : '';
    if (!lista.length) {
      corpo.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma carta encontrada.</td></tr>`;
      return;
    }
    corpo.innerHTML = lista.map(e => `
      <tr class="linha" onclick="abrirDetalhe('${e.id}')">
        <td><b>${esc(e.titulo)}</b></td>
        <td>${esc(e.responsavel) || '<span style="color:#b7bcc4">—</span>'}</td>
        <td>${e.malha ? `<span class="tag">${esc(e.malha)}</span>` : ''}</td>
        <td>${esc(e.orgao)}</td>
        <td>${esc((e.tema || '').substring(0, 70))}${(e.tema || '').length > 70 ? '…' : ''}</td>
        <td style="white-space:nowrap">${fmtData(e.criado_em)}</td>
      </tr>`).join('');
  } catch (e) {
    corpo.innerHTML = `<tr><td colspan="6" class="vazio">Erro ao carregar histórico.</td></tr>`;
  }
}

async function abrirDetalhe(id) {
  try {
    const r = await fetch(`${API}/${id}`).then(r => r.json());
    if (!r.success) return alert('Não foi possível carregar os detalhes.');
    entradaAtual = r.entrada;
    cacheAtribuicao = { responsavel: entradaAtual.responsavel || '', area: entradaAtual.area || '' };
    renderModal();
    document.getElementById('overlay').classList.add('aberto');
  } catch (e) { alert('Erro ao abrir detalhes.'); }
}

function valorCampo(chave) {
  const e = entradaAtual;
  if (chave === 'malha') return e.malha || '';
  return (e && e[chave] != null) ? String(e[chave]) : '';
}

function renderModal() {
  const e = entradaAtual;
  document.getElementById('m-titulo').textContent = e.titulo || '(sem título)';

  const body = document.getElementById('m-body');
  body.innerHTML = CAMPOS_SHAREPOINT.map((c, idx) => {
    const val = c.chave ? valorCampo(c.chave) : '';
    const vazio = !val;
    let valorHtml;
    if (c.editavel) {
      valorHtml = `<input id="edit-${c.chave}" value="${esc(val)}" placeholder="preencher…" oninput="marcarAtribuicao('${c.chave}', this.value)" />`;
    } else if (c.chave) {
      valorHtml = `<span class="lc-valor${vazio ? ' vazio-campo' : ''}" id="val-${idx}">${vazio ? '(preencher no SharePoint)' : esc(val)}</span>`;
    } else {
      valorHtml = `<span class="lc-valor vazio-campo">(preencher no SharePoint)</span>`;
    }
    const btnCopia = (c.chave && !c.editavel && !vazio)
      ? `<button class="copia" onclick="copiar('${esc(val).replace(/'/g, "\\'")}', this)">Copiar</button>`
      : (c.editavel ? `<button class="copia" onclick="copiarEdit('${c.chave}', this)">Copiar</button>` : '');
    return `<div class="linha-campo">
        <div class="lc-label">${c.rot}</div>
        <div style="flex:1">${valorHtml}</div>
        ${btnCopia}
      </div>`;
  }).join('') + `<div class="minuta-box" id="minuta-box"></div>`;

  document.getElementById('minuta-box').textContent = e.minuta || '';
  document.getElementById('minuta-box').classList.remove('aberto');

  document.getElementById('m-baixar').onclick = () => { window.location = `${API}/${e.id}/docx`; };
  document.getElementById('m-excluir').onclick = () => excluir(e.id);
  document.getElementById('m-copiar-tudo').onclick = copiarTudo;
  document.getElementById('m-salvar').onclick = () => salvarAtribuicao(e.id);
}

function marcarAtribuicao(chave, valor) {
  cacheAtribuicao[chave] = valor;
  document.getElementById('m-salvar').style.display = 'inline-block';
}
function copiarEdit(chave, btn) {
  copiar(document.getElementById('edit-' + chave).value, btn);
}

function copiar(texto, btn) {
  navigator.clipboard.writeText(texto).then(() => {
    if (btn) { const t = btn.textContent; btn.textContent = '✓'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = t; btn.classList.remove('ok'); }, 1200); }
  });
}

function copiarTudo() {
  const linhas = CAMPOS_SHAREPOINT.map(c => {
    const val = c.chave ? (c.editavel ? (cacheAtribuicao[c.chave] || '') : valorCampo(c.chave)) : '';
    return `${c.rot}: ${val}`;
  });
  copiar(linhas.join('\n'), document.getElementById('m-copiar-tudo'));
}

async function salvarAtribuicao(id) {
  try {
    await fetch(`${API}/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cacheAtribuicao),
    });
    entradaAtual.responsavel = cacheAtribuicao.responsavel;
    entradaAtual.area = cacheAtribuicao.area;
    document.getElementById('m-salvar').style.display = 'none';
    carregarOpcoes();
    carregarLista();
  } catch (e) { alert('Erro ao salvar.'); }
}

async function excluir(id) {
  if (!confirm('Excluir esta entrada do histórico? Esta ação não pode ser desfeita.')) return;
  try {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    fecharModal();
    carregarLista();
  } catch (e) { alert('Erro ao excluir.'); }
}

function toggleMinuta() {
  document.getElementById('minuta-box').classList.toggle('aberto');
}
function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  entradaAtual = null;
}
function aplicarFiltros() { carregarLista(); }
function limparFiltros() {
  ['f-q','f-responsavel','f-malha','f-orgao','f-de','f-ate'].forEach(id => document.getElementById(id).value = '');
  carregarLista();
}

document.getElementById('overlay').addEventListener('click', (ev) => {
  if (ev.target.id === 'overlay') fecharModal();
});
document.getElementById('f-q').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') carregarLista(); });

carregarOpcoes();
carregarLista();
</script>
</body>
</html>
